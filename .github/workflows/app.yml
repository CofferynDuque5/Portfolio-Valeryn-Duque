# Verifica la app (analyze + tests) y compila el APK que se publica en la web
# como /downloads/cofferyncode-app.apk. El APK queda como artefacto del run.
name: App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL del backend (sin /api)
        default: https://cofferyncode.nvcorx.com

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://cofferyncode.nvcorx.com' }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk cofferyncode-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cofferyncode-app
          path: cofferyncode-app.apk
          if-no-files-found: error
